# OpenDopa のツール・環境変数・タスク(ADR-0012 A3, A8, A9)
# 使い方: `mise install` → `mise run setup` → `mise run dev`。タスクの一覧は `mise tasks`。

[tools]
node = "26.13.0"
pnpm = "12.16.1"
python = "3.13.18"
uv = "0.13.6"
rust = { version = "1.99.1", components = "clippy,rustfmt" }
dbmate = "2.37.0"
terraform = "1.16.2"
lefthook = "2.2.2"

[env]
# ルートの .env.local を全アプリに渡す(なければ .env.example をコピーする: `mise run setup`)
_.file = ".env.local"
# dbmate(ADR-0013 A2)。スキーマの dump はしない(pg_dump が要るため。スキーマは db/migrations が正)
DBMATE_MIGRATIONS_DIR = "db/migrations"
DBMATE_NO_DUMP_SCHEMA = "true"

# ---- セットアップ ----

[tasks.setup]
description = "初回のセットアップ(.env.local の作成、依存のインストール、git hook の登録)"
run = [
  "test -f .env.local || cp .env.example .env.local",
  "pnpm install",
  "uv sync --project pipeline",
  "cargo fetch --manifest-path services/recsys/Cargo.toml",
  "lefthook install",
]

# ---- 起動 ----

[tasks.dev]
description = "web と recsys をまとめて起動する"
depends = ["web", "recsys"]

[tasks.web]
description = "web(Next.js)を起動する(http://localhost:3000)"
dir = "apps/web"
run = "pnpm dev"

[tasks.recsys]
description = "recsys(Rust)を起動する(http://localhost:8080)"
dir = "services/recsys"
run = "cargo run -p recsys-server"

# ---- DB(docker-compose の PostgreSQL。ADR-0013) ----

[tasks.db-up]
description = "DB(PostgreSQL + pgvector)を起動し、マイグレーションを流す"
run = ["docker compose up -d --wait db", "dbmate up"]

[tasks.db-down]
description = "DB を止める(データは残る)"
run = "docker compose down"

[tasks.db-reset]
description = "DB のデータを消して作り直し、マイグレーションを流す"
run = ["docker compose down --volumes", "docker compose up -d --wait db", "dbmate up"]

[tasks.db-migrate]
description = "未適用のマイグレーションを流す(dbmate up)"
run = "dbmate up"

[tasks.db-new]
description = "マイグレーションのファイルを作る(例: mise run db-new add_foo)"
run = "dbmate new"

[tasks.db-psql]
description = "DB に psql でつなぐ"
run = "docker compose exec db psql -U opendopa -d opendopa"

# ---- 型の生成 ----

[tasks.gen-types]
description = "packages/shared/schema の JSON Schema から TS の型と pydantic のモデルを生成する(ADR-0012 A2, A13)"
run = [
  "pnpm --filter @opendopa/shared gen",
  "cd pipeline && uv run datamodel-codegen --input ../packages/shared/schema/scene.schema.json --input-file-type jsonschema --output opendopa_pipeline/generated/scene.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.13 --use-annotated --use-standard-collections --use-union-operator --field-constraints --disable-timestamp --use-schema-description --use-field-description --formatters ruff-format",
]

[tasks."gen-types:check"]
description = "生成した型がスキーマと一致しているかを確かめる(CI 用)"
depends = ["gen-types"]
run = "git diff --exit-code -- packages/shared/src/generated pipeline/opendopa_pipeline/generated"

# ---- インフラ(Terraform。ADR-0016) ----
# apply は課金が発生する。plan を確かめてから人が実行する。

[tasks.infra-init]
description = "Terraform を初期化する(infra/backend.hcl が必要。bootstrap は infra/bootstrap/bootstrap.sh)"
run = "make infra-init"

[tasks.infra-plan]
description = "Terraform の plan を出す(infra/tfplan に保存)"
run = "make infra-plan"

[tasks.deploy]
description = "イメージをビルドして Container Registry に push し、Container Apps を更新する(要 az login。課金されるリソースを操作する。ADR-0018)"
run = "make deploy"

[tasks.infra-apply]
description = "保存した plan(infra/tfplan)を apply する。リソースが作られ、課金される"
run = "make infra-apply"

# ---- 整形・lint・テスト ----

[tasks.decisions-index]
description = "ADR と小さな決定(docs/decisions/)の索引を出す"
run = "python scripts/decisions_index.py"

[tasks.fmt]
description = "全言語の整形"
run = [
  "pnpm --filter web exec biome check --write .",
  "uv run --project pipeline ruff format .",
  "uv run --project pipeline ruff check --fix .",
  "cargo fmt --manifest-path services/recsys/Cargo.toml --all",
  "terraform -chdir=infra fmt -recursive",
]

[tasks.lint]
description = "全言語の lint(CI と同じ)"
depends = ["lint:*"]

[tasks."lint:web"]
dir = "apps/web"
run = "pnpm lint"

[tasks."lint:shared"]
dir = "packages/shared"
run = "pnpm typecheck"

[tasks."lint:pipeline"]
dir = "pipeline"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks."lint:infra"]
description = "Terraform の整形検査と validate(バックエンドには接続しない)"
run = [
  "terraform -chdir=infra fmt -check -recursive",
  "terraform -chdir=infra init -backend=false -input=false -lockfile=readonly",
  "terraform -chdir=infra validate",
]

[tasks."lint:recsys"]
dir = "services/recsys"
run = ["cargo fmt --all --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.test]
description = "全言語のテスト"
depends = ["test:*"]

[tasks."test:web"]
dir = "apps/web"
run = "pnpm test"

[tasks."test:shared"]
dir = "packages/shared"
run = "pnpm test"

[tasks."test:pipeline"]
dir = "pipeline"
run = "uv run pytest"

[tasks."test:recsys"]
dir = "services/recsys"
run = "cargo test"
