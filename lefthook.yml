# commit 前の軽いチェック(ADR-0012 A17)。重いチェック(clippy、テスト、型の差分)は CI(#14 で追加予定)に任せる。
# 登録: `mise run setup`(中で `lefthook install` を実行する)
pre-commit:
  parallel: true
  jobs:
    - name: web
      root: apps/web/
      glob: "*.{ts,tsx,mts,js,mjs}"
      run: mise exec -- pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: pipeline
      root: pipeline/
      glob: "*.py"
      exclude:
        - "opendopa_pipeline/generated/**"
      run: mise exec -- uv run ruff format {staged_files} && mise exec -- uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: recsys
      root: services/recsys/
      glob: "*.rs"
      run: mise exec -- rustfmt --edition 2024 {staged_files}
      stage_fixed: true
